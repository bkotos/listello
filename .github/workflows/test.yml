name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UI dependencies
        run: npm ci

      - name: Test
        run: make test

  test-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - name: Test against PostgreSQL
        run: make test-api-postgres

  build:
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install UI dependencies
        run: npm ci

      - name: Build
        run: make build
